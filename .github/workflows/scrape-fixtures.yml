name: Scrape Fixtures

on:
  schedule:
    # Monday 9am and Thursday 9am
    - cron: '0 9 * * 1,4'
  workflow_dispatch:  # Manual trigger

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
          
      - name: Scrape fixtures
        run: |
          python scripts/scrape_fixtures.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (
            git commit -m "🤖 Auto-update fixtures $(date '+%Y-%m-%d %H:%M')"
            git push
          )

  notify:
    runs-on: ubuntu-latest
    needs: scrape-and-update
    if: always()
    
    steps:
      - name: Send Telegram notification
        if: vars.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ vars.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ vars.TELEGRAM_CHAT_ID }}" \
            -d text="⚽ *Fixtures Updated!*%0A%0AFresh predictions ready for the weekend. Check it out! 👇%0Ahttps://betting-ai.vercel.app" \
            -d parse_mode="Markdown"
        continue-on-error: true
